name: Apply student program icons

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-student-program-icons.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch student card program icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/ogrenciler/students-client.tsx')
          text = path.read_text()

          old_union = '''  | "file"\n  | "calendar"\n  | "archive";'''
          new_union = '''  | "file"\n  | "pin"\n  | "group"\n  | "calendar"\n  | "archive";'''
          if text.count(old_union) != 1:
              raise SystemExit(f'icon union match count: {text.count(old_union)}')
          text = text.replace(old_union, new_union, 1)

          old_paths = '''    file: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></>,\n    calendar: <><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></>,'''
          new_paths = '''    file: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></>,\n    pin: <><path d="M12 21s6-5.3 6-12A6 6 0 0 0 6 9c0 6.7 6 12 6 12Z"/><circle cx="12" cy="9" r="2"/></>,\n    group: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,\n    calendar: <><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></>,'''
          if text.count(old_paths) != 1:
              raise SystemExit(f'icon paths match count: {text.count(old_paths)}')
          text = text.replace(old_paths, new_paths, 1)

          old_markup = '''              <div className="studentProgramLine">\n                <span>📍 {student.branch_name || "Şube yok"}</span>\n                <span>👥 {student.group_name || "Grup yok"}</span>\n                <strong>\n                  🗓 {scheduleLabel(student) || "Program tanımlı değil"}\n                </strong>\n              </div>'''
          new_markup = '''              <div className="studentProgramLine">\n                <span><Icon name="pin" size={17} />{student.branch_name || "Şube yok"}</span>\n                <span><Icon name="group" size={17} />{student.group_name || "Grup yok"}</span>\n                <strong>\n                  <Icon name="calendar" size={17} />{scheduleLabel(student) || "Program tanımlı değil"}\n                </strong>\n              </div>'''
          if text.count(old_markup) != 1:
              raise SystemExit(f'program markup match count: {text.count(old_markup)}')
          text = text.replace(old_markup, new_markup, 1)

          css_anchor = '''      .studentProgramLine strong {\n        color: #0b3d70;'''
          css_insert = '''      .studentProgramLine > span,\n      .studentProgramLine > strong {\n        display: flex;\n        align-items: center;\n        gap: 8px;\n      }\n\n      .studentProgramLine > span svg,\n      .studentProgramLine > strong svg {\n        flex: 0 0 auto;\n        color: #1769e8;\n      }\n\n      .studentProgramLine strong {\n        color: #0b3d70;'''
          if text.count(css_anchor) != 1:
              raise SystemExit(f'css anchor match count: {text.count(css_anchor)}')
          text = text.replace(css_anchor, css_insert, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ogrenciler/students-client.tsx
          git diff --cached --check
          git commit -m "Use consistent SVG icons in student cards"
          git push origin main
