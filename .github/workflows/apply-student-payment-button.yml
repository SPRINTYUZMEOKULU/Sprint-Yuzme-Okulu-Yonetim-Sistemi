name: Apply student payment button patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-student-payment-button.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply patch
        run: python scripts/patch_student_payment.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ogrenciler/students-client.tsx
          git diff --cached --check
          git commit -m "Make student payment status actionable"
          git push origin main
